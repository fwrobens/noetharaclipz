[project]
name = "noetharaclipz-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "faster-whisper==1.2.1",
    "opencv-python-headless==4.12.0.88",
    "scenedetect==0.6.7.1",
    "numpy==2.2.6",
    "av==16.0.1",
]
[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
