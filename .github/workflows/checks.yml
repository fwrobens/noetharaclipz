name: Application checks
# Manual only: verify GitHub Actions allowance before running on this private repository.
on: workflow_dispatch
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Lint changed frontend files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t changed_files < <(git diff --name-only origin/main...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if (( ${#changed_files[@]} == 0 )); then
            echo "No frontend JavaScript/TypeScript files changed; skipping targeted ESLint."
          else
            printf 'Linting changed frontend files:\n%s\n' "${changed_files[@]}"
            npx eslint "${changed_files[@]}"
          fi
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --project worker --frozen
      - run: uv run --project worker ruff check worker
      - run: uv run --project worker pytest worker/tests -q
# CI never receives production credentials and cannot spend AI quota.
